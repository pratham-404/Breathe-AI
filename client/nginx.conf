limit_req_zone $binary_remote_addr zone=predictions:10m rate=30r/m;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = /api/predict {
    limit_req zone=predictions burst=5 nodelay;
    proxy_pass http://api:8000/predict;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location = /api/models {
    proxy_pass http://api:8000/models;
  }

  location = /healthz {
    proxy_pass http://api:8000/health/ready;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
